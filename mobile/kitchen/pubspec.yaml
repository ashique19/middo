name: middo_kitchen
description: "Middo Kitchen — cook partner app for order groups, prep, and dispatch."
publish_to: 'none'
version: 0.2.1+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.0.0
  google_fonts: ^6.3.2
  http: ^1.6.0
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  firebase_core: ^3.15.1
  firebase_messaging: ^15.2.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
